# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pip requirements
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to migrations/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# The path separator used here should be the separator specified by "version_path_separator" below.
# version_locations = %(here)s/bar:%(here)s/bat:migrations/versions

# Separator for the multi-value path settings above (`version_locations`,
# `prepend_sys_path`). `os` means os.pathsep. Alembic warns on every invocation if it is
# unset, and the legacy fallback splits on spaces *and* commas *and* colons - which quietly
# mangles any absolute path on a platform where one of those is legal. This replaced
# `version_path_separator`, deprecated since 1.16.
path_separator = os

# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# A generated revision is a source file in `src/`, so it is linted and format-checked by
# CI like everything else - and autogenerate's output is not ruff-clean on its own (it
# writes one-argument-per-line calls at whatever indentation it likes). Running ruff here
# means `alembic revision --autogenerate` produces a file that already passes, rather than
# a PR that fails on formatting the first time it is pushed.
#
# `exec` against a bare `ruff`, so it resolves from whatever environment invoked alembic -
# `uv run alembic ...` puts the project's own pinned ruff first on PATH. `--fix` is
# redundant with `fix = true` in pyproject.toml, and harmless if that ever changes.
# Format first, then lint: autogenerate writes lines well past the 120-column limit, so a
# `check` pass on the raw output reports dozens of E501s that `format` was about to fix
# anyway - alarming output for a step that succeeded.
hooks = ruff_format, ruff_check
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
