[project]
name = "opendiving-api"
version = "0.1.0"
requires-python = "~=3.14.0"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.6.1",
    "fastapi>=0.109.1",
    "uvicorn>=0.27.0",
    "uvloop>=0.19.0",
    "httptools>=0.6.1",
    # There is no `uuid` requirement, deliberately: the PyPI project of that name is a 2006
    # backport of a module that has been in the standard library since 2.5. It was listed here
    # and nothing ever imported it - `import uuid` resolves to the stdlib, which precedes
    # site-packages on `sys.path`. `uuid6` is the real dependency; it supplies `uuid7()`.
    "uuid6>=2024.1.12",
    # 1.16 for the `path_separator` config option, which replaced `version_path_separator`
    # and is what silences the legacy-splitting warning on `prepend_sys_path`.
    "alembic>=1.16.0",
    "asyncpg>=0.29.0",
    "SQLAlchemy-Utils>=0.41.1",
    "python-jose>=3.3.0",
    "SQLAlchemy>=2.0.25",
    "python-multipart>=0.0.9",
    "greenlet>=2.0.2",
    "httpx>=0.26.0",
    "pydantic-settings>=2.0.3",
    "redis>=5.0.1",
    "arq>=0.25.0",
    "bcrypt>=4.1.1",
    "psycopg2-binary>=2.9.9",
    "fastcrud>=0.15.5",
    "crudadmin>=0.4.2",
    "google-auth[requests]>=2.28.0",
    "gunicorn>=23.0.0",
    "defusedxml>=0.7.1",
    "fitdecode>=0.11.0",
    # The DiveJSON converter, and the only reason logbook import accepts anything but
    # DiveJSON. Runtime rather than dev: `services/logbook_import/reader.py` sniffs and
    # converts on the request path, so an import that lives in the `dev` extra would fail
    # at container start with every test green (`DECISIONS.md`, *The importer is a reader,
    # not a validator*). It also carries the JSON Schema and the beyond-schema rules the
    # tests used to reach through a vendored copy.
    "divejson>=0.6.0",
    "webauthn>=3.0.0",
    # Decodes and re-encodes uploaded avatars (`services/user_avatars.py`) - the only
    # image processing in the app. 12.0.0 is the first release with official Python 3.14
    # support; 11.3.0's cp314 wheels were built against the beta and say so. The manylinux
    # wheels bundle libwebp, so the WebP output needs no system library in the image.
    "pillow>=12.0.0",
    # The client behind `FILE_STORAGE_BACKEND=s3` (`services/blob_store.py`). A main
    # dependency rather than an extra, even though most installs never select that backend:
    # the shipped image is built with `uv sync --locked` and no extras, so an s3-only extra
    # would be absent from the one place the hosted instance runs. Its cost is botocore's
    # ~26 MB of service models in every image; `DECISIONS.md`, *"A second backend, because
    # the disk stopped being shared"*, weighs that against signing the requests by hand.
    "boto3>=1.43.93",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "pytest-mock>=3.14.0",
    "pytest-cov>=7.1.0",
    "faker>=26.0.0",
    "mypy>=1.8.0",
    "types-redis>=4.6.0",
    "ruff>=0.1.0",
    # Formats the markdown docs (DECISIONS.md above all). mdformat-gfm adds the table
    # and strikethrough support core mdformat lacks - without it, tables are reflowed
    # as paragraphs. Settings live in `.mdformat.toml`.
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    # Validates generated UDDF exports against the vendored schema
    # (tests/fixtures/uddf/) in tests only - the runtime writer builds its XML with the
    # stdlib and never validates.
    "xmlschema>=3.0.0",
    # `jsonschema` is deliberately absent: the vendored schema and the port of the
    # reference validator that needed it are gone, and `divejson` - a main dependency
    # since the importer converts on the request path - brings it in for the tests that
    # call `divejson.validate_document`.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.hatch.build.targets.wheel]
include = ["src/"]
packages = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "F", # Pyflakes
    # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "E", # pycodestyle
    "W", # Warning
    # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    # https://docs.astral.sh/ruff/rules/#mccabe-c90
    "C", # Complexity (mccabe+) & comprehensions
    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "UP", # pyupgrade
    # https://docs.astral.sh/ruff/rules/#isort-i
    "I", # isort
]
ignore = [
    # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "E402", # module level import not at top of file
    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "UP006", # use-pep585-annotation
    "UP007", # use-pep604-annotation
    "E741",  # Ambiguous variable name
    # "UP035", # deprecated-assertion
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # unused import
    "F403", # star imports
]

[tool.ruff.lint.mccabe]
# Ruff's default is 10. This codebase has a handful of legitimately branchy functions
# (the dive-file parsers, the gear-service due-date arithmetic), and lowering this would
# mostly generate noqa comments rather than simpler code. Raise the bar deliberately if
# those get split up.
max-complexity = 24

# NOTE: a `[tool.ruff.lint.pydocstyle] convention = "numpy"` block used to sit here. It
# did nothing - "D" was never in `select` above, so no docstring rule ever ran and the
# convention setting had nothing to configure. Removed rather than left looking active;
# add "D" to `select` if docstring linting is actually wanted.

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::PendingDeprecationWarning:starlette.formparsers",
]

[tool.coverage.run]
source = ["src/app"]

[tool.coverage.report]
precision = 2

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
    "httpx2>=0.1.0",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Both spellings of the same code: `app.*` when checked as `mypy src` (which resolves
# through `mypy_path`), `src.app.*` when reached from the test suite's imports. Without
# the second, `disallow_untyped_defs` silently stopped applying to everything a test
# pulls in.
module = ["app.*", "src.app.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
# Every schema in `app.schemas` declares optional fields as
# `Annotated[T | None, Field(default=None)]`. Pydantic's mypy plugin does not read
# defaults out of `Annotated` - only the `x: T = Field(default=...)` assignment form -
# so it synthesizes an `__init__` where those fields are required, and every test that
# builds a schema while omitting an optional field is reported as a missing argument.
# That was 108 false positives, which is why the test suite was never type-checked.
#
# Disabled only for `tests.*`, and only this one code: `arg-type`, `attr-defined`,
# `no-any-return` and the rest still apply here. Production code is unaffected - drop
# this override once the plugin handles `Annotated` defaults, and the real missing
# arguments it would catch come back.
disable_error_code = ["call-arg"]
