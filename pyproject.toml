[project]
name = "opendiving-api"
version = "0.1.0"
requires-python = "~=3.14.0"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.6.1",
    "fastapi>=0.109.1",
    "uvicorn>=0.27.0",
    "uvloop>=0.19.0",
    "httptools>=0.6.1",
    "uuid>=1.30",
    "uuid6>=2024.1.12",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "SQLAlchemy-Utils>=0.41.1",
    "python-jose>=3.3.0",
    "SQLAlchemy>=2.0.25",
    "python-multipart>=0.0.9",
    "greenlet>=2.0.2",
    "httpx>=0.26.0",
    "pydantic-settings>=2.0.3",
    "redis>=5.0.1",
    "arq>=0.25.0",
    "bcrypt>=4.1.1",
    "psycopg2-binary>=2.9.9",
    "fastcrud>=0.15.5",
    "crudadmin>=0.4.2",
    "google-auth[requests]>=2.28.0",
    "gunicorn>=23.0.0",
    "defusedxml>=0.7.1",
    "resend>=2.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "pytest-mock>=3.14.0",
    "pytest-cov>=7.1.0",
    "faker>=26.0.0",
    "mypy>=1.8.0",
    "types-redis>=4.6.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.hatch.build.targets.wheel]
include = ["src/"]
packages = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "F", # Pyflakes
    # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "E", # pycodestyle
    "W", # Warning
    # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    # https://docs.astral.sh/ruff/rules/#mccabe-c90
    "C", # Complexity (mccabe+) & comprehensions
    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "UP", # pyupgrade
    # https://docs.astral.sh/ruff/rules/#isort-i
    "I", # isort
]
ignore = [
    # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "E402", # module level import not at top of file
    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "UP006", # use-pep585-annotation
    "UP007", # use-pep604-annotation
    "E741",  # Ambiguous variable name
    # "UP035", # deprecated-assertion
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # unused import
    "F403", # star imports
]

[tool.ruff.lint.mccabe]
# Ruff's default is 10. This codebase has a handful of legitimately branchy functions
# (the dive-file parsers, the gear-service due-date arithmetic), and lowering this would
# mostly generate noqa comments rather than simpler code. Raise the bar deliberately if
# those get split up.
max-complexity = 24

# NOTE: a `[tool.ruff.lint.pydocstyle] convention = "numpy"` block used to sit here. It
# did nothing - "D" was never in `select` above, so no docstring rule ever ran and the
# convention setting had nothing to configure. Removed rather than left looking active;
# add "D" to `select` if docstring linting is actually wanted.

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::PendingDeprecationWarning:starlette.formparsers",
]

[tool.coverage.run]
source = ["src/app"]

[tool.coverage.report]
precision = 2

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
    "httpx2>=0.1.0",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Both spellings of the same code: `app.*` when checked as `mypy src` (which resolves
# through `mypy_path`), `src.app.*` when reached from the test suite's imports. Without
# the second, `disallow_untyped_defs` silently stopped applying to everything a test
# pulls in.
module = ["app.*", "src.app.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
# Every schema in `app.schemas` declares optional fields as
# `Annotated[T | None, Field(default=None)]`. Pydantic's mypy plugin does not read
# defaults out of `Annotated` - only the `x: T = Field(default=...)` assignment form -
# so it synthesizes an `__init__` where those fields are required, and every test that
# builds a schema while omitting an optional field is reported as a missing argument.
# That was 108 false positives, which is why the test suite was never type-checked.
#
# Disabled only for `tests.*`, and only this one code: `arg-type`, `attr-defined`,
# `no-any-return` and the rest still apply here. Production code is unaffected - drop
# this override once the plugin handles `Annotated` defaults, and the real missing
# arguments it would catch come back.
disable_error_code = ["call-arg"]
