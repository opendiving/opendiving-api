# Blank issues stay enabled on purpose: the forms above exist to collect the version and install
# details a bug report is useless without, not to refuse anything that doesn't fit one of three
# shapes. A report nobody anticipated is worth more than a well-formatted one.
blank_issues_enabled: true

contact_links:
  - name: Security vulnerability
    url: https://github.com/opendiving/opendiving-api/security/advisories/new
    about: >-
      Report it privately here, never as a public issue — every instance is exposed for as long as
      it takes to cut a release. No GitHub account? security@opendiving.app.

  - name: Installing, upgrading, backing up or configuring
    url: https://github.com/opendiving/opendiving/issues/new
    about: >-
      The install bundle and the self-hosting docs live in opendiving/opendiving, and issues about
      running an instance belong there with them. Troubleshooting docs first if you haven't read
      them. Same maintainer either way, so if you can't tell which side it is, file it wherever
      looks right and it will be moved.

  - name: Question about the API itself
    url: https://github.com/opendiving/opendiving/discussions
    about: >-
      Endpoints, parsers, the schema, running it from source — anything about this codebase rather
      than about an instance. The project keeps one Discussions space, in opendiving/opendiving, and
      it covers this repository too; it gets answered faster there than in the tracker.

  - name: Something in the web app
    url: https://github.com/opendiving/opendiving-web/issues/new/choose
    about: >-
      Anything you saw in a browser — a page, a form, a chart — belongs in the frontend repository.
      If you can't tell which side it is, file it here and it will be moved.
