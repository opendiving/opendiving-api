name: PR Title

on:
  pull_request:
    # `edited` is the one that matters: it re-runs the check when a title is
    # corrected, so a failing PR goes green without an empty commit to push.
    #
    # `synchronize` is not about the title at all - it is what lets this be a
    # required check. A required check has to have passed on the PR's *latest*
    # head SHA, so without a run per push, a PR that gains a second commit
    # would sit at "Expected - waiting for status" for good. The title is read
    # from the event payload rather than from the tree, so the extra runs
    # reach the same verdict.
    types: [opened, edited, reopened, synchronize]

# The one list of types, read by both jobs below: the check that enforces them
# and the labels that carry them into the release notes. CONTRIBUTING.md spells
# the same list out in prose - keep the two in step.
env:
  TYPES: feat|fix|refactor|docs|test|chore|perf|ci|build|revert

jobs:
  semantic-title:
    runs-on: ubuntu-latest

    # Nothing is checked out and no API call is made - the title arrives in the
    # event payload - so this job needs no token at all. Labelling does need one,
    # which is why it is a separate job rather than a step here.
    permissions: {}

    steps:
      # PRs here are squash-merged, so this title becomes the commit subject on
      # `main`. It is the only part of a branch that outlives the branch, which
      # is why it is checked and the individual commits are not.
      #
      # The title is passed through `env` rather than interpolated into the
      # script. `${{ github.event.pull_request.title }}` written inside `run:`
      # is substituted before bash parses the line, so a title containing
      # backticks or `$(...)` would execute as shell.
      - name: Check title is a conventional commit subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN="^($TYPES)(\([a-z0-9._-]+\))?!?: .+"

          if printf '%s' "$TITLE" | grep -Eq "$PATTERN"; then
            echo "OK: $TITLE"
            exit 0
          fi

          echo "PR title is not a semantic commit subject:"
          echo "    $TITLE"
          echo
          echo "Expected: <type>[(scope)][!]: <description>"
          echo "Types:    ${TYPES//|/, }"
          echo
          echo "Examples: feat: extract and serve per-sample dive profiles"
          echo "          fix(dives): reject a profile with no samples"
          echo "          feat!: drop the response envelope"
          echo
          echo "Edit the title - this check re-runs on edit, no push needed."
          exit 1

  # The label is what `.github/release.yml` files the PR under when the release
  # notes are generated. Deriving it from the title rather than asking for it by
  # hand means the two can never disagree.
  label:
    needs: semantic-title

    # A fork's `GITHUB_TOKEN` is read-only whatever a workflow asks for, so this
    # would fail on every external contribution. Skipping it there is why it is
    # its own job: the title check above is the *required* one, and a red X on
    # every outside PR is the last thing this repository needs the week it goes
    # public. Fork PRs get labelled by hand, or by a maintainer retitling them.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    permissions:
      # `pull-requests: write` applies the label. `issues: write` is what creates
      # one that doesn't exist yet - labels are an issues-API resource, and
      # `gh pr edit --add-label` fails outright on a name the repository has
      # never seen, which is every name until the first PR of that type.
      pull-requests: write
      issues: write

    steps:
      - name: Label the PR with its type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # api.github.com bursts-fail, and this step used to take one on the chin. On
          # 2026-09-13 two `HTTP 500`s inside a single run turned an otherwise-clean PR
          # red: the label read failed, its empty output read as "no such label", and
          # the create that followed hit a label that had been there all along. Three
          # attempts, because a second 500 immediately after the first is much rarer
          # than the first; the pause widens, 5s then 10s, so a burst that outlasts one
          # retry has somewhere to land. Fifteen seconds is the whole worst case, and
          # only a PR that was going to go red anyway ever pays it.
          #
          # $1 is a glob matched against a failing attempt's output. A match is an
          # *expected* non-zero state rather than a flap, so it returns 2 straight away
          # instead of spending the remaining attempts and their backoff on a verdict
          # that will not change; pass '' where the command has no such state. Running
          # out of attempts returns 1, and every caller below treats that as fatal.
          # Going quietly green is worth less than a red X here. A run that read
          # nothing leaves the PR unlabelled, and `.github/release.yml`'s trailing
          # `"*"` catch-all does not drop it from the notes - it files it under Other
          # changes, which is worse, because a `feat:` missing from Features looks
          # like a category nobody had anything for. Notes generated weeks later by
          # somebody who never saw this job are where that surfaces.
          #
          # stderr is folded into stdout because that is where gh writes the message
          # both the glob and the error lines below need; nothing would print it
          # otherwise.
          gh_retry() {
            local expect=$1
            shift
            local out i
            for i in 1 2 3; do
              if out=$("$@" 2>&1); then
                printf '%s' "$out"
                return 0
              fi
              if [ -n "$expect" ]; then
                case $out in
                  $expect)
                    printf '%s' "$out"
                    return 2
                    ;;
                esac
              fi
              if [ "$i" -lt 3 ]; then
                sleep $((i * 5))
              fi
            done
            printf '%s' "$out"
            return 1
          }

          # The title matched the pattern above, so this extracts from a known
          # shape - and the result can only ever be one of `$TYPES`, which is
          # what keeps a title from naming an arbitrary label.
          TYPE="$(printf '%s' "$TITLE" | sed -nE "s/^($TYPES)(\([a-z0-9._-]+\))?!?:.*/\1/p")"
          if [ -z "$TYPE" ]; then
            echo "::error::Could not read a type out of the title, which should not be possible after the check above."
            exit 1
          fi

          want=("$TYPE")
          if printf '%s' "$TITLE" | grep -Eq "^($TYPES)(\([a-z0-9._-]+\))?!:"; then
            want+=(breaking)
          fi

          # Everything this job owns. A `feat!:` retitled to `fix:` has to lose
          # both of its old labels, or the PR stays in the Breaking section of
          # notes generated weeks later - and nobody re-reads a merged PR's
          # labels to catch that.
          IFS='|' read -r -a managed <<< "$TYPES"
          managed+=(breaking)

          # Read into a variable first and only then into an array. `mapfile -t x <
          # <(gh ...)` cannot fail: the failure belongs to the process substitution,
          # `mapfile` succeeds on the nothing it was handed, and a repository whose
          # labels could not be read becomes indistinguishable from one that has none.
          # `rc` is that whole distinction. An empty `$names` with `rc` 0 really is a
          # repository with no labels yet - the first PR into a fresh clone of this
          # workflow - and must go on to create.
          rc=0
          names=$(gh_retry '' gh label list --limit 200 --json name --jq '.[].name') || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Could not read this repository's labels: $names"
            exit 1
          fi
          existing=()
          if [ -n "$names" ]; then
            mapfile -t existing <<< "$names"
          fi

          # Same shape, and here the stake is the removals rather than the creates: a
          # read that quietly returned nothing would leave a retitled PR carrying its
          # old type into the notes, which is the one thing the removal loop exists to
          # stop.
          rc=0
          names=$(gh_retry '' gh pr view "$PR" --json labels --jq '.labels[].name') || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Could not read the labels already on #$PR: $names"
            exit 1
          fi
          current=()
          if [ -n "$names" ]; then
            mapfile -t current <<< "$names"
          fi

          contains() {
            local needle="$1"
            shift
            local item
            for item in "$@"; do
              if [ "$item" = "$needle" ]; then
                return 0
              fi
            done
            return 1
          }

          args=()
          for label in "${want[@]}"; do
            # Created on demand rather than seeded once by hand, so a fresh clone
            # of this workflow into another repository needs no setup step. Only
            # ever created, never updated: a colour someone tuned in the UI is
            # theirs to keep.
            if ! contains "$label" "${existing[@]}"; then
              case "$label" in
                breaking) colour=b60205 ;;
                feat) colour=0e8a16 ;;
                fix) colour=1d76db ;;
                *) colour=ededed ;;
              esac
              rc=0
              out=$(gh_retry '*already exists*' gh label create "$label" \
                --color "$colour" --description "Set from the PR title by pr-title.yml") || rc=$?
              case "$rc" in
                0) ;;
                # The label is there, which is the whole of what this step wanted of
                # it. It can get there without this run creating it in two ordinary
                # ways: the read above was taken before a concurrent run on another PR
                # created it, or one of this call's own earlier attempts did the work
                # and it was the reply that flapped. Neither is a reason to fail a PR,
                # and `--force` is not the answer either - it would take a tuned colour
                # back off whoever tuned it.
                2) echo "The \`$label\` label already exists, which is fine." ;;
                *) echo "::error::Could not create the \`$label\` label: $out"; exit 1 ;;
              esac
            fi
            args+=(--add-label "$label")
          done

          for label in "${current[@]}"; do
            if contains "$label" "${managed[@]}" && ! contains "$label" "${want[@]}"; then
              args+=(--remove-label "$label")
            fi
          done

          # Retried like the reads. `--add-label`/`--remove-label` name an end state
          # rather than a change to apply, so a second attempt after a flap that had in
          # fact landed asks only for what is already true.
          rc=0
          out=$(gh_retry '' gh pr edit "$PR" "${args[@]}") || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Could not set the labels on #$PR: $out"
            exit 1
          fi
