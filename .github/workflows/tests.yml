name: Tests

on:
  push:
    branches:
      - main
  pull_request:

# The job only reads *this repository*: it checks out, installs, migrates the throwaway Postgres in
# the `services:` block below, and runs the suite. `contents: read` is what checkout needs and the
# whole of what it needs, and saying so keeps the token off whatever the repository default happens
# to grant. That matters more than it looks, and more here than in the other two: this job installs
# the dev dependency tree and then executes it outright - `alembic upgrade head` imports the app,
# and pytest runs the suite against it. `persist-credentials: false` on the checkout is the other
# half: without it the token is left behind in `.git/config`, in that same workspace.
#
# Nothing in the job wants more than read. `alembic upgrade head` writes to the service container's
# database, which is thrown away with the runner, and the coverage summary is written to
# `$GITHUB_STEP_SUMMARY` - a file on the runner, collected by the Actions runtime token rather than
# by any `GITHUB_TOKEN` scope.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    # The suite is mostly pure-logic unit tests, but a handful of modules guard behaviour
    # only Postgres can settle - the `CheckConstraint`s it enforces, the window functions
    # a renumber runs, whether a query filtered by `user_id` at all - and they skip
    # themselves when nothing is listening. Without these services they skipped silently
    # on every run and that behaviour was effectively untested in CI.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        # Same major as `docker-compose.yml`'s `redis:8-alpine`, and moved with it: CI has
        # to run the suite against the Redis the compose file ships, or "tested" and
        # "shipped" stop being the same claim. This was `redis:7` while compose floated on
        # `redis:alpine` - which had already become 8 - so the two disagreed silently.
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: local
      SECRET_KEY: test-secret-key-for-testing-only
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      REDIS_CACHE_HOST: localhost
      REDIS_CACHE_PORT: 6379
      REDIS_QUEUE_HOST: localhost
      REDIS_QUEUE_PORT: 6379
      # The app creates and probes this directory at startup and refuses to boot if it
      # cannot write there. Its default is `/data/files` - a path that exists inside the
      # container image and nowhere else, least of all on a runner. `tests/conftest.py`
      # sets the same variable for pytest itself (it has to, since `settings` is read at
      # import); this covers the `alembic upgrade head` step, which imports the app too.
      #
      # A literal path, not `${{ runner.temp }}`: the `runner` context is not available in
      # a job-level `env:` block, and using it here does not fail the step - it makes the
      # whole workflow file invalid, so the job never runs and never appears in
      # `gh pr checks` at all. Which looks exactly like a green PR.
      FILE_STORAGE_DIR: /tmp/opendiving-files

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install package with dev dependencies
        run: uv sync --extra dev

      # `check` is the half that cannot be got anywhere else: it autogenerates against a
      # database the migrations just built and fails if it finds any difference, so a model
      # changed without a matching revision fails the PR rather than the first deploy.
      # `upgrade head` is what gives it that database, from empty - the shipped install
      # path, every revision in order.
      #
      # This runs against `POSTGRES_DB` (`postgres`); the suite runs against its own
      # database, `postgres_test`, which `tests/conftest.py` creates and migrates itself.
      # The two were the same database until a suite run corrupted a developer's dev
      # database the same way, and the step no longer has to come before the tests to avoid
      # colliding with them. It stays first because a drift failure is cheaper to read than
      # a suite that failed on a column nobody generated a revision for.
      - name: Run migrations and check for model drift
        working-directory: src
        run: |
          uv run alembic upgrade head
          uv run alembic check

      # Teed so the assertion below reads *this* run rather than a second one of its own.
      # `pipefail` is not on by default in an Actions `run:` block (the shell is `bash -e`),
      # and without it the pipeline reports tee's exit status - a failing suite would go
      # green.
      - name: Run tests with coverage
        id: tests
        run: |
          set -o pipefail
          uv run pytest -rs --cov=src/app --cov-report=term-missing | tee /tmp/pytest.txt

      # The DB-backed tests skip themselves rather than fail when Postgres is
      # unreachable, which is the right behaviour locally but means a broken `services:`
      # block above would look exactly like a green run. Fail the job instead.
      #
      # Asserted against the whole run rather than against a list of the DB-backed modules
      # by name. That list was `test_dive_check_constraints.py` and `test_dive_numbering.py`
      # when it was written and has grown with nearly every change to the suite since, and
      # it goes stale in the one direction that matters: a module missing from it stops
      # being checked, silently. (A count here would rot the same way - this comment
      # carried one for a while, and it was wrong within two PRs.)
      #
      # This makes *any* skip a failure, which is stricter than it sounds - the suite has
      # none today. There is deliberately no allowlist: a count cannot tell a deliberate
      # skip from an unreachable database, so the first test that genuinely has to skip
      # means reworking this check (against the `SKIPPED` lines `-rs` prints, say) rather
      # than filling in a slot. Hence the message naming both causes.
      #
      # Read off the tail rather than the whole file: pytest's counts line is always last,
      # so this cannot be tripped by a failing test whose *captured output* contains
      # "3 skipped". The `-rs` and `FAILED` lines share the window, which only ever adds a
      # redundant annotation to an already-red job.
      - name: Assert no test skipped
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          if tail -5 /tmp/pytest.txt | grep -qE "[0-9]+ skipped"; then
            tail -5 /tmp/pytest.txt | grep -E "[0-9]+ skipped"
            echo "::error::Tests skipped - either Postgres was unreachable from the job or a test skipped deliberately. See the counts line above."
            exit 1
          fi

      # Runs whenever the tests step actually executed (pass or fail), but
      # not if it was skipped entirely because an earlier step failed first.
      - name: Write coverage summary
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          { echo "## Test Coverage"; echo; uv run coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
