name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    # The suite is mostly pure-logic unit tests, but a handful of modules guard behaviour
    # only Postgres can settle - the `CheckConstraint`s it enforces, the window functions
    # a renumber runs, whether a query filtered by `user_id` at all - and they skip
    # themselves when nothing is listening. Without these services they skipped silently
    # on every run and that behaviour was effectively untested in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: local
      SECRET_KEY: test-secret-key-for-testing-only
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      REDIS_CACHE_HOST: localhost
      REDIS_CACHE_PORT: 6379
      REDIS_QUEUE_HOST: localhost
      REDIS_QUEUE_PORT: 6379

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install package with dev dependencies
        run: uv sync --extra dev

      # Teed so the assertion below reads *this* run rather than a second one of its own.
      # `pipefail` is not on by default in an Actions `run:` block (the shell is `bash -e`),
      # and without it the pipeline reports tee's exit status - a failing suite would go
      # green.
      - name: Run tests with coverage
        id: tests
        run: |
          set -o pipefail
          uv run pytest --cov=src/app --cov-report=term-missing | tee /tmp/pytest.txt

      # The DB-backed tests skip themselves rather than fail when Postgres is
      # unreachable, which is the right behaviour locally but means a broken `services:`
      # block above would look exactly like a green run. Fail the job instead.
      #
      # Asserted against the whole run rather than against a list of the DB-backed modules
      # by name. That list was `test_dive_check_constraints.py` and `test_dive_numbering.py`
      # when it was written and is eight modules now, and it goes stale in the one
      # direction that matters: a module missing from it stops being checked, silently.
      #
      # This makes *any* skip a failure, which is stricter than it sounds - the suite has
      # none today. A test that genuinely has to skip (a platform guard, an optional
      # dependency) needs an exclusion carved out here, and that is the right place to have
      # the argument about whether it should skip in CI at all.
      - name: Assert the database-backed tests actually ran
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          if grep -qE "[0-9]+ skipped" /tmp/pytest.txt; then
            echo "::error::Tests skipped - Postgres was probably not reachable from the job."
            exit 1
          fi

      # Runs whenever the tests step actually executed (pass or fail), but
      # not if it was skipped entirely because an earlier step failed first.
      - name: Write coverage summary
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          { echo "## Test Coverage"; echo; uv run coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
