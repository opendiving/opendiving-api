name: Publish Image

# Three ways in, and they mean different things.
#
# A `v*` tag push is the release path: it publishes the whole alias set for that version
# and publishes this repository's component release. Tags are cut deliberately rather than
# per merge - by the product repository's `release-cut.yml`, which bumps the version-bearing
# files here and tags the commit that lands, so the tag agrees with `pyproject.toml` the way
# the guard below insists on - because self-hosters consume releases as events, and a
# version per merge trains people onto `:latest` instead of reading what changed.
#
# A push to `main` is the edge channel, and it exists for the project's own instance
# rather than for anybody else's: it publishes `:edge` and `:sha-<12>` and nothing else -
# never `:latest`, never a semver alias - so no tag a self-hoster can pin moves without a
# release being cut. The `deploy` job at the bottom then hands Render the digest this run
# built. That is the whole of what the branch trigger changed: the release path above is
# untouched, and an `:edge` nobody is pinned to is not a version per merge.
#
# `workflow_dispatch` is everything else: a staging build off a branch, or rebuilding an
# already-released version because its base image grew a CVE. That second case is why a
# dispatch pointed at a `v*` tag recomputes the *full* alias set rather than the one tag
# somebody remembered to type - a hand-typed subset leaves everyone following `X.Y` on the
# vulnerable digest.
#
# `workflow_dispatch` only becomes reachable once this file is on the *default* branch:
# that is where GitHub looks for the "Run workflow" button and where `gh workflow run`
# resolves the workflow id. The `ref` input below selects the commit to build, so being
# launched from `main` costs nothing.
#
# This is modelled on `opendiving-web`'s workflow of the same name, deliberately: the two
# repos release in lockstep on one version, so the tag set, the guard and the failure
# modes want to be the same thing said twice rather than two things that resemble each
# other. What differs between the two files is only what has to: the manifest read for the
# version check, the title and description, and what emulating the other architecture would
# cost. Anything else that drifts apart is a port owed one way or the other.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, branch or tag to build"
        required: true
        default: main
      tag:
        description: "Extra image tag, e.g. staging (optional)"
        required: false
        default: ""
      latest:
        description: "Also push :latest"
        type: boolean
        default: false

# `packages: write` is the whole point of the job; `contents: read` is what checkout
# needs. The GITHUB_TOKEN these grant is also what links the resulting package back to
# this repository, so no personal access token is involved. The release job needs
# `contents: write`, which is granted to that job alone rather than to everything.
permissions:
  contents: read
  packages: write

# Two runs pushing different commits can otherwise race over a shared tag - `:edge` on two
# merges a few minutes apart, `:latest`, or the same `tag` typed twice - and leave it
# pointing at whichever finished last. Queue rather than cancel: a cancelled push can leave
# the tag on the older image, and it would also drop that commit's deploy on the floor,
# since the `deploy` job only runs for the build it belongs to.
#
# **Two groups, split by channel**, because a group holds one running run and one *pending*
# run, and a third arrival cancels the pending one. On the edge channel that loss is
# acceptable: a burst of merges leaves the ones in the middle unbuilt, which is the right
# trade for a channel whose only consumer wants the tip - every commit that does build still
# carries its own `:sha-<12>`, and the last merge of the burst is the one deployed. It is not
# acceptable on the release path, and one shared group would have imposed it there: a `v*` tag
# is pushed straight after the version bump merges, so the tag run queues behind that merge's
# own edge build and any merge landing meanwhile cancels it outright - no `X.Y.Z`, no `X.Y`,
# no `:latest`, no release, and a cancelled check that looks exactly like the
# dropped-merge case above.
#
# A `workflow_dispatch` sits with the releases even when it is launched from `main`, because
# it can be told to push `:latest` and it can be pointed at a `v*` tag. The two groups overlap
# on exactly one name, `:sha-<12>`, and only when a release is cut at a commit `main` has
# already built: both runs build the same commit from the same tree, so the tag lands on one
# of two images of one source and a digest read back through it may be the other run's. That
# is a tie, not a race.
concurrency:
  group: publish-image-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'edge' || 'release' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Everything decided once, so the two build jobs and the merge cannot disagree about
  # what they are building or what to call it.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      # Rejected here rather than by the registry at the end of a multi-minute build.
      # The tag is passed through `env` and never interpolated into the script:
      # `${{ inputs.tag }}` written inside `run:` is substituted before bash parses the
      # line, so a value containing backticks or `$(...)` would execute as shell.
      #
      # Anchored with bash's `=~`, whose `^` and `$` bind to the whole string. `grep -Eq`
      # is the obvious spelling and is wrong here: its anchors are per *line* and `-q`
      # succeeds on any matching line, so a value with an embedded newline passes on the
      # strength of one legal line and carries the rest through - into `TAGS` below, where
      # every line becomes another tag pushed to the registry.
      #
      # The rejected value is printed with `%q` rather than pasted into the `::error::`
      # line, where its own newlines would be read as further workflow commands.
      - name: Check the extra tag is a legal image tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            printf 'Rejected tag input: %q\n' "$TAG"
            echo "::error::Not a valid image tag - it must be a single line starting with a letter, digit or '_', then containing only letters, digits, '.', '_' and '-', up to 128 characters."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # On any push - a `v*` tag or `main` - `inputs.ref` is empty and this falls through
          # to `github.sha`, which is the commit that event carried.
          #
          # Deliberately not `github.ref`, which stood here until `main` became a trigger and
          # was harmless only because it wasn't one. On a tag push `github.ref` names the tag,
          # which resolves to one commit forever; on a push to `main` it names a *branch*, and
          # `actions/checkout` resolves a branch to its tip when the job runs rather than to
          # the commit that queued the run. Every SHA below is read out of the working tree,
          # so a run triggered by c1 that starts after c2 has merged would build, tag, label
          # and deploy c2 while reporting against c1 - and c1 would get no `:sha-` image at
          # all. The queue above makes that window a whole preceding build long, so it is the
          # ordinary case rather than a narrow race.
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # On a `workflow_dispatch` `github.sha` is NOT the commit being built: it is the tip of
      # whichever branch the workflow file was launched from, and `inputs.ref` - which wins on
      # that path - is what names the commit. Every SHA below therefore comes from the working
      # tree after checkout, which also pins a moving `ref` (a branch name typed into the
      # input) to the exact commit this image was built from. That is the same distinction
      # from the other side: `github.sha` is right for the checkout above, where it is the
      # only fixed point a push offers, and wrong for the labels and the `APP_COMMIT` build
      # arg, which take `needs.prepare.outputs.sha`.
      - name: Work out tags and labels
        id: meta
        env:
          # The ref as a human named it, which is what decides whether this is a release
          # build. `github.ref_name` on a tag push is the bare tag; on a dispatch it is
          # the branch the workflow was launched from, so the input wins there; on a main
          # push it is `main`, which matches neither guard below - the edge channel gates
          # on the event, not on this, and assembles no alias that needs checking.
          SOURCE_REF: ${{ inputs.ref || github.ref_name }}
          EXTRA_TAG: ${{ inputs.tag }}
          PUSH_LATEST: ${{ inputs.latest }}
          IS_TAG_PUSH: ${{ github.ref_type == 'tag' && github.event_name == 'push' }}
          IS_MAIN_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION=""

          # A dispatch may name a tag either way round. Left as `refs/tags/v1.2.3` the
          # version check below would not recognise it and the build would quietly publish
          # a `sha-` image with none of its aliases - the exact silent outcome the guard
          # exists to prevent.
          SOURCE_REF="${SOURCE_REF#refs/tags/}"
          SOURCE_REF="${SOURCE_REF#refs/heads/}"

          # One tag per line, which is the format the merge step wants.
          TAGS="${IMAGE}:sha-${SHA:0:12}"

          # The tag<->manifest guard. A two-repo release ritual will eventually tag the
          # wrong commit, and the failure mode is silent: images published under a version
          # whose manifest says something else. Recovery when this fires is cheap because
          # nothing has been pushed yet - delete the tag, fix, re-tag.
          #
          # Every tag push enters this block, because the trigger is `v*` and anything
          # under that glob which cannot be aliased has to fail rather than publish a bare
          # `sha-` image nobody asked for. A dispatch is a human naming a ref, so it enters
          # on `v` plus a digit - close enough to catch `v1.42` typed for `v1.4.2`, and far
          # enough from the `feat/`-shaped branch names this repo actually uses.
          if [ "$IS_TAG_PUSH" = "true" ] || [[ "$SOURCE_REF" =~ ^v[0-9] ]]; then
            # Shape first, so `vnext` is told what is wrong with it rather than being told
            # it disagrees with a manifest it was never going to match. Nothing here can
            # alias a pre-release, and PEP 440 spells one without the hyphen SemVer wants
            # (`0.2.0rc1`), so the shape that is refused is every shape but `vX.Y.Z`.
            if [[ ! "$SOURCE_REF" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::${SOURCE_REF} is not a vX.Y.Z tag. Pre-releases and other shapes are not something this pipeline knows how to alias."
              exit 1
            fi
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            VERSION="${SOURCE_REF#v}"

            MANIFEST="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            if [ "$VERSION" != "$MANIFEST" ]; then
              echo "::error::Tag ${SOURCE_REF} does not match the pyproject.toml version ${MANIFEST}. Bump the manifest, or re-tag the commit that has it."
              exit 1
            fi

            TAGS="${TAGS}"$'\n'"${IMAGE}:${VERSION}"$'\n'"${IMAGE}:${MAJOR}.${MINOR}"
            # A bare `0` alias would invite pinning to "any 0.x" - exactly the range whose
            # minors are allowed to break - so the major alias starts at 1.0.0.
            if [ "$MAJOR" -ge 1 ]; then
              TAGS="${TAGS}"$'\n'"${IMAGE}:${MAJOR}"
            fi
            # A tag push is by definition the newest version. A dispatch at an old tag is
            # a CVE rebuild, where `latest` must stay where it is - hence the checkbox
            # rather than an assumption.
            if [ "$IS_TAG_PUSH" = "true" ]; then
              PUSH_LATEST=true
            fi
          fi

          # The edge channel. `:edge` is the only moving name a main push publishes, and
          # the deliberate absence is everything else: no `:latest`, no `X.Y.Z`, no `X.Y`.
          # Those are what a self-hoster pins to, and they may only move when a human cuts
          # a tag - which is also why this sits outside the version block above rather than
          # beside it. `sha-<12>` is already on `TAGS` and is what the deploy pins to.
          if [ "$IS_MAIN_PUSH" = "true" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:edge"
          fi

          # The extra tag is for names like `staging`. A version typed into it would be
          # published without any of the aliases that version is supposed to carry, and
          # off whatever commit `ref` happens to name - the guard above never sees it.
          #
          # The `v` is optional on purpose, and that is the half that matters: the aliases
          # this workflow publishes are bare (`0.4.0`, `0.4`), so `tag=0.4.0` would point a
          # real release alias at an unchecked commit, where `tag=v0.4.0` merely invents a
          # name nothing else uses. Reserving every leading digit is the cheap way to say
          # it - a `staging`-shaped input never starts with one.
          if [[ "$EXTRA_TAG" =~ ^v?[0-9] ]]; then
            echo "::error::${EXTRA_TAG} looks like a version. Point 'ref' at the tag instead, which publishes the whole alias set and checks it against the manifest."
            exit 1
          fi

          if [ -n "$EXTRA_TAG" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:${EXTRA_TAG}"
          fi
          if [ "$PUSH_LATEST" = "true" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi

          # A multi-line `$GITHUB_OUTPUT` value ends at the first line equal to the
          # delimiter, and the runner matches that line before bash ever sees the value.
          # A fixed `EOF` therefore puts the terminator inside the value's own alphabet:
          # anything that can smuggle a newline in can close the block early and go on to
          # set outputs of its own. The check above is what stops that today; this makes
          # the write safe on its own terms rather than on that step's continued presence.
          DELIM="EOF_$(openssl rand -hex 8)"

          {
            echo "sha=$SHA"
            echo "version=$VERSION"
            echo "tags<<$DELIM"
            echo "$TAGS"
            echo "$DELIM"
            echo "labels<<$DELIM"
            # `image.source` is what makes the package show up on the repository page and
            # inherit its access settings; the rest is what `docker inspect` reports.
            echo "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
            echo "org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}"
            echo "org.opencontainers.image.revision=$SHA"
            echo "org.opencontainers.image.created=$CREATED"
            echo "org.opencontainers.image.title=opendiving-api"
            echo "org.opencontainers.image.description=OpenDiving API"
            echo "org.opencontainers.image.licenses=AGPL-3.0-or-later"
            if [ -n "$VERSION" ]; then
              echo "org.opencontainers.image.version=$VERSION"
            fi
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

  # One native runner per architecture. `linux/arm64` under QEMU is the alternative, and
  # not a near thing here: every dependency without an aarch64 wheel compiles from source
  # under emulation, on every release. Each job pushes an untagged, single-platform image
  # and reports its digest; `merge` is what turns the pair into the multi-arch manifest
  # list the tags actually point at.
  build:
    needs: prepare
    strategy:
      # Both architectures reported, rather than the first failure cancelling the other.
      # The pushes are by digest and untagged, so a half-finished round names nothing.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The resolved commit, not the ref: a branch can move between these jobs, and
          # that would put two architectures of different code behind one manifest.
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Needed for the `type=gha` cache below - the default docker driver cannot export
      # to it.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.labels }}
          # What the running app reports as `commit` from `/api/v1/health`. On the edge
          # channel `version` is the manifest's `0.1.0` for every deploy, so the commit is
          # the only thing that identifies which build answered - which the AGPL source
          # offer needs, and which a bug report needs for the same reason. The resolved
          # SHA rather than `github.sha`: on a dispatch those differ (see `prepare`), and
          # an image that names a commit it was not built from is worse than one that
          # names none. It is the same value as the `image.revision` label, deliberately.
          build-args: |
            APP_COMMIT=${{ needs.prepare.outputs.sha }}
          # `push-by-digest` pushes the image with no tag at all and hands back its
          # digest. Tagging happens once, in `merge`, on the manifest list - tagging here
          # would leave each architecture briefly overwriting the other's tag.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # The dependency layer is `RUN --mount=type=bind` on uv.lock/pyproject.toml, so
          # its cache key tracks those two files: a commit that only touched `src/` reuses
          # it and the build is a copy plus a `uv sync --no-editable`. Scoped per
          # architecture, because one shared scope has the two jobs evicting each other's
          # layers on every build, which costs more than the cache saves.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # Buildx would otherwise push a provenance attestation alongside the image,
          # which renders on the GHCR package page as an extra `unknown/unknown` entry
          # next to the two real architectures. Drop the `false` if the attestation is
          # ever worth more than a readable package listing.
          provenance: false

      # An empty file named after the digest, because that is all the merge step needs and
      # an artifact cannot carry a bare string. The name is the digest without its
      # `sha256:` prefix, which is what `imagetools` wants to be handed back.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.summary.outputs.digest }}

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Every tag is created in this one call, so all of them name the same manifest list
      # and the same digest. That is what makes the CVE-rebuild story work: recomputing
      # `X.Y.Z`, `X.Y` and `latest` together cannot leave an alias behind on an older
      # digest.
      #
      # Labels live on the per-architecture images that `build` pushed; an index carries
      # annotations instead, and GHCR reads `image.source` from there when it decides
      # which repository a package belongs to.
      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          LABELS: ${{ needs.prepare.outputs.labels }}
        run: |
          set -euo pipefail

          ARGS=()
          while IFS= read -r TAG; do
            if [ -n "$TAG" ]; then ARGS+=(--tag "$TAG"); fi
          done <<< "$TAGS"
          while IFS= read -r LABEL; do
            if [ -n "$LABEL" ]; then ARGS+=(--annotation "index:$LABEL"); fi
          done <<< "$LABELS"

          # Without `nullglob` an empty directory leaves the pattern itself in the loop,
          # and `image@sha256:*` is a source docker would have to be told is nonsense.
          shopt -s nullglob
          SOURCES=()
          for DIGEST in *; do
            SOURCES+=("${IMAGE}@sha256:${DIGEST}")
          done
          if [ "${#SOURCES[@]}" -eq 0 ]; then
            echo "::error::No digests were downloaded - nothing to merge."
            exit 1
          fi

          docker buildx imagetools create "${ARGS[@]}" "${SOURCES[@]}"

      # Also where the deploy job gets the digest it pins to. Read back from the registry
      # through the immutable `sha-<12>` tag rather than from `edge`, which the next merge
      # moves - a deploy that resolved a moving tag could redeploy a commit that is not
      # the one this run built.
      - name: Summarise what was pushed
        id: summary
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:sha-${SHA:0:12}" --format '{{.Manifest.Digest}}')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "## Pushed"
            echo
            echo "Commit \`$SHA\`, digest \`$DIGEST\`, \`linux/amd64\` + \`linux/arm64\`"
            echo
            printf '%s\n' "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  # The other half of the edge channel. An image-backed Render service does not redeploy
  # when a new image appears on the tag it follows, so publishing `:edge` changes nothing
  # on its own; the deploy is this call.
  #
  # It names the **digest**, not `edge`. A hook that named the tag would be resolved by
  # Render whenever it got round to it, so two merges a minute apart could deploy in either
  # order - and the loser would roll the instance backwards onto code that had already been
  # superseded.
  #
  # Main-push only. A `v*` build is a release for self-hosters, and the commit it tags is
  # already on `main` and has already been deployed from here; a dispatch is a scratch or
  # CVE-rebuild image. Neither has any business touching the instance.
  deploy:
    needs: merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Nothing here talks to GitHub's API - the hooks are the whole job - so it gets no
    # token at all rather than inheriting the workflow's `packages: write`.
    permissions: {}

    steps:
      - name: Deploy the digest this run built
        env:
          HOOKS: ${{ secrets.RENDER_DEPLOY_HOOKS }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          set -euo pipefail

          if [ -z "$DIGEST" ]; then
            echo "::error::The merge job reported no digest, so there is nothing safe to deploy."
            exit 1
          fi

          # The secret is absent on a fork, and was absent in this repository until the
          # instance existed. Neither is a broken build: the image is published either way,
          # and a red X on every outside contributor's merge is how a check stops being
          # read. So this is a notice and a zero exit.
          if [ -z "${HOOKS//[[:space:]]/}" ]; then
            echo "::notice::No RENDER_DEPLOY_HOOKS secret is set - the image was published, nothing was deployed."
            exit 0
          fi

          # One hook per service, comma-separated, because this image serves two of them
          # (`api` and `worker`) and Render deploys one service per hook. Newlines are
          # accepted as separators too - a secret pasted one URL per line is the likely
          # mistake, and silently deploying only the first service would be a bad way to
          # find out.
          #
          # Each hook carries its own key in its query string, so an individual hook is a
          # credential that GitHub's masking does **not** cover: it masks the secret's whole
          # value, not the substrings a split produces. Hence `add-mask` per hook before it
          # is used anywhere - including by `curl`, whose own diagnostics quote the URL.
          FAILED=0
          INDEX=0
          IFS=',' read -ra HOOK_LIST <<< "${HOOKS//$'\n'/,}"
          for RAW in "${HOOK_LIST[@]}"; do
            HOOK="${RAW//[[:space:]]/}"
            [ -n "$HOOK" ] || continue
            echo "::add-mask::$HOOK"
            INDEX=$((INDEX + 1))

            # `imgURL` is what pins the deploy to this manifest list. Appended with `&`
            # because a deploy hook already carries a `key` query parameter, and unescaped
            # because a digest reference is letters, digits and `/ . - _ : @` - every one
            # of them legal unencoded in a query value (RFC 3986 `pchar`, plus `/`).
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X POST --max-time 30 \
              "${HOOK}&imgURL=${IMAGE}@${DIGEST}")" || CODE=000
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
              echo "Hook ${INDEX}: HTTP ${CODE}"
            else
              echo "::error::Hook ${INDEX} returned HTTP ${CODE}. The image is published; that service was not redeployed."
              FAILED=1
            fi
          done

          if [ "$INDEX" -eq 0 ]; then
            echo "::error::RENDER_DEPLOY_HOOKS is set but holds no hook URL."
            exit 1
          fi

          # Red, because a service left on the previous digest while its sibling moved is
          # exactly the state nobody notices. Re-running this job is the whole fix - the
          # image is published either way, so nothing has to be rebuilt to retry.
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::At least one service was not redeployed. Fix the hook and re-run this job."
            exit 1
          fi

          echo "Deployed ${IMAGE}@${DIGEST} to ${INDEX} service(s)."

  # A release exists for the notes, not for the artifacts - the install bundle and its
  # assets are published by `opendiving/opendiving`, and this repository's release is the
  # record of what went into the image an operator pulls. `.github/release.yml` sorts the
  # PRs by the labels `pr-title.yml` applies, and the notes go out as generated: the release
  # somebody reads before deciding to upgrade is the product one next door, and that is the
  # one that still gets a headline and a Breaking section written by hand. It runs after
  # `merge`, so a build that failed leaves no release behind and the tag is free to be
  # deleted and re-cut.
  #
  # The job id is a check-run name and `opendiving-web` carries the mirror of this job under
  # the same one, so the rename off `draft-release` had to land in both files together - it
  # did. Keep them in step. DECISIONS.md, *The component release publishes itself*, is why.
  publish-release:
    needs: [prepare, merge]
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - leaving it as it is."
            exit 0
          fi
          gh release create "$TAG" --generate-notes --title "$TAG"
