name: Type Checking

on:
  push:
    branches:
      - main
  pull_request:

# The job only reads: it checks out, installs, and runs mypy three times. `contents: read` is what
# checkout needs and the whole of what it needs, and saying so keeps the token off whatever the
# repository default happens to grant. That matters more than it looks - `uv sync --extra dev`
# installs the whole dev dependency tree into the workspace and mypy then runs out of it, plugin
# included (`plugins = ["pydantic.mypy"]` is imported and executed), so anything the token can do a
# compromised transitive dependency can do too. `persist-credentials: false` on the checkout is the
# other half: without it the token is left behind in `.git/config`, in that same workspace.
permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install package with dev dependencies
        run: uv sync --extra dev

      # `src` and `tests` are checked separately rather than as one `mypy src tests`: the
      # app is reachable as both `app.*` (via `mypy_path = "src"`) and `src.app.*` (how the
      # tests import it), and checking both roots at once makes mypy refuse with "source
      # file found twice under different module names". The `scripts` step below is third
      # for its own unrelated reason, given there.
      - name: Run mypy on src
        run: uv run mypy src --config-file pyproject.toml
        env:
          ENVIRONMENT: local
          SECRET_KEY: test-secret-key-for-testing-only

      - name: Run mypy on tests
        run: uv run mypy tests --config-file pyproject.toml
        env:
          ENVIRONMENT: local
          SECRET_KEY: test-secret-key-for-testing-only

      # `scripts/` imports nothing from the app, so it needs neither the env nor its own
      # invocation for the module-name reason above - it is separate only because it is not
      # under either root.
      - name: Run mypy on scripts
        run: uv run mypy scripts --config-file pyproject.toml
