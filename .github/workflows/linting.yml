name: Linting

on:
  push:
    branches:
      - main
  pull_request:

# The job only reads: it checks out, installs, and runs ruff and mdformat in check mode.
# `contents: read` is what checkout needs and the whole of what it needs, and saying so keeps the
# token off whatever the repository default happens to grant. That matters more than it looks -
# `uv sync --extra dev` installs the whole dev dependency tree into the workspace and the checks
# then run out of it, so anything the token can do a compromised transitive dependency can do too.
# `persist-credentials: false` on the checkout is the other half: without it the token is left
# behind in `.git/config`, in that same workspace.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install package with dev dependencies
        run: uv sync --extra dev

      - name: Run Ruff
        run: uv run ruff check src tests scripts

      - name: Check formatting
        run: uv run ruff format --check src tests scripts

      # Paths are spelled out because mdformat 1.0 has no `--exclude`, and handing it a
      # directory walks everything below it - `.venv/` included, which is 60-odd
      # markdown files from site-packages.
      - name: Check markdown formatting
        run: uv run mdformat --check *.md docs .github
