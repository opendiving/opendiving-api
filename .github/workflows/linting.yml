name: Linting

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install package with dev dependencies
        run: uv sync --extra dev

      - name: Run Ruff
        run: uv run ruff check src tests scripts

      - name: Check formatting
        run: uv run ruff format --check src tests scripts

      # Paths are spelled out because mdformat 1.0 has no `--exclude`, and handing it a
      # directory walks everything below it - `.venv/` included, which is 60-odd
      # markdown files from site-packages.
      - name: Check markdown formatting
        run: uv run mdformat --check *.md docs
