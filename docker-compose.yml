services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Dev matches deploy semantics: a laptop that sleeps, a Docker daemon that restarts,
    # a container that dies at 3am - all come back. `unless-stopped` rather than `always`
    # so `docker compose stop` stays stopped across a daemon restart.
    restart: unless-stopped
    # -------- replace with comment to run with gunicorn --------
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    env_file:
      - ./src/.env
    # -------- replace with comment if you are using nginx --------
    ports:
      - "8000:8000"
    # expose:
    #   - "8000"
    # Wait for the datastores to answer, not merely to have been started - otherwise the
    # app's startup `alembic upgrade head` races an initializing Postgres. `admin_init` is
    # a one-shot that must finish before any worker serves `/admin`.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      admin_init:
        condition: service_completed_successfully
    volumes:
      - ./src/app:/code/app
      - ./src/.env:/code/.env
      # One-shot maintenance scripts (`src/scripts/`) import their modules as `src.app.*`,
      # so they need the package rooted at `/code/src` - the app itself is served from
      # `/code/app` and is unaffected. This is what makes
      # `docker compose exec api python -m src.scripts.backfill_dive_profiles` work.
      - ./src:/code/src
      # Migrations are baked into the image at these paths (see Dockerfile), and the
      # startup `alembic upgrade head` reads them from there. Bind-mounted over so a
      # revision written on the host applies on `docker compose restart api` rather than
      # on the next rebuild - the same reason `./src/app` is mounted.
      - ./src/migrations:/code/migrations
      - ./src/alembic.ini:/code/alembic.ini

  # One-shot: creates the admin panel's own tables and seeds its initial admin, then
  # exits. Runs to completion before `api` starts, so the four gunicorn workers in the
  # production image never race each other doing it (see src/scripts/initialize_admin.py).
  # Exits 0 immediately when CRUD_ADMIN_ENABLED is false, so it costs nothing when the
  # panel is off.
  admin_init:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m src.scripts.initialize_admin
    restart: "no"
    # Same inherited-HTTP-healthcheck problem as `worker` below, with a different ending:
    # this container exits inside the image check's 20s start period, so the check never
    # got as far as reporting `(unhealthy)` and nothing had to be done about it. That is a
    # coincidence of how fast seeding is, not a property of a one-shot - a slow database
    # makes it untrue. Disabled outright, since a container that serves no HTTP has no
    # business being asked for an HTTP status.
    healthcheck:
      disable: true
    env_file:
      - ./src/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/code/src
      - ./src/.env:/code/.env

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: arq app.core.worker.settings.WorkerSettings
    restart: unless-stopped
    # Overrides the image's HEALTHCHECK, which GETs `/api/v1/health/ready` over localhost. This
    # service shares `api`'s image but serves no HTTP, so the inherited check can only
    # ever fail - it reported `(unhealthy)` permanently while the worker ran its crons
    # fine. Arq's own `--check` reads the sentinel key the worker keeps in Redis (see
    # `health_check_interval` in app/core/worker/settings.py, which bounds how stale a
    # pass can be), so this covers both "the process is alive" and "it can reach Redis".
    healthcheck:
      test: ["CMD", "arq", "--check", "app.core.worker.settings.WorkerSettings"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file:
      - ./src/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src/app:/code/app
      - ./src/.env:/code/.env

  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - ./src/.env
    volumes:
      # Postgres 18+ images store the cluster in a version-specific PGDATA
      # (/var/lib/postgresql/18/docker) under this mount, so the volume goes one level up from
      # the old .../data path - do not "fix" it back, the entrypoint refuses to start either way.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # -------- replace with comment to run migrations with docker --------
    expose:
      - "5432"
    # Publishes Postgres on the host so `psql` and the test suite can reach it directly.
    # Local development only - do not carry this stanza into a deployment, where it puts
    # the database on a routable interface.
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    # Pinned to a major for the same reason `db` is, and kept in step with the `redis`
    # service in .github/workflows/tests.yml - CI running the suite against the version
    # the compose file ships is what makes "tested" and "shipped" the same claim. `alpine`
    # on its own is a floating `latest`: it resolves to whatever major is current on the
    # day someone pulls, so two machines a year apart run different Redis and neither
    # knows it.
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  # Local mail inbox, opt-in: `docker compose --profile mail up`. Off by default because
  # the documented local sign-in flow is the magic link in `docker compose logs api`,
  # which has to keep working with nothing extra running - and most sessions never open
  # an inbox. Point `SMTP_HOST=mailpit`, `SMTP_PORT=1025`, `SMTP_TLS_MODE=none` at it
  # (see src/.env.example), and comment `SMTP_HOST` back out when you're done.
  mailpit:
    # Mailpit publishes no bare-major tag, so `v1.30` is the widest pin available.
    image: axllent/mailpit:v1.30
    restart: unless-stopped
    profiles: ["mail"]
    # The web inbox only. It holds live sign-in tokens, so it is bound to the loopback
    # for the same reason the Postgres port above is. 1025 stays unpublished: `api` and
    # `worker` reach it over the compose network, and nothing on the host should.
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"

  #-------- uncomment to run with pgadmin --------
