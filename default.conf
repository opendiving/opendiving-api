# ---------------- Running With One Server ----------------
server {
    listen 80;

    # The app accepts card images up to 10 MB (`MAX_CARD_FILE_SIZE`) and dive computer
    # files up to 5 MB (`MAX_DIVE_FILE_SIZE`). nginx's default is 1 MB, which would
    # reject the larger half of those here - before the request ever reaches the app, so
    # the caller gets nginx's bare 413 instead of the app's explanatory one. Set a little
    # above the app's own ceiling so the app stays the thing that enforces it.
    client_max_body_size 12m;

    # Applied to error responses too, which `add_header` alone would skip.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Only meaningful once this is served over TLS - harmless over plain HTTP, where
    # browsers ignore it. Uncomment once a certificate is in place and the redirect is
    # known good, since it is hard to walk back.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


