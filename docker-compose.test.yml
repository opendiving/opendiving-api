# Overlay for running the test suite against real Postgres and Redis:
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up --build --abort-on-container-exit api
#
# One of two ways to exercise the eight DB-backed test modules, which skip themselves when nothing
# is listening on Postgres. Here `db` resolves and nothing needs overriding; on the host it takes
# `POSTGRES_SERVER=localhost`, since `src/.env` names the compose hostname. See CONTRIBUTING.md.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # Dev dependencies come from `uv.lock` via the `dev` extra, installed at image
      # build time. The previous `pip install faker pytest-asyncio pytest-mock` at
      # container start pulled unpinned versions and needed `user: root` to write into
      # the image's site-packages - both gone now.
      target: test
    command: pytest tests/ -v
    volumes:
      - ./tests:/code/tests
      - ./src:/code/src
