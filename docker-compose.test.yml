# Overlay for running the test suite against real Postgres and Redis:
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up --build --abort-on-container-exit api
#
# One of two ways to exercise the DB-backed test modules, which skip themselves when nothing is
# listening on Postgres. Here `db` resolves and nothing needs overriding; on the host it takes
# `POSTGRES_SERVER=localhost`, since `src/.env` names the compose hostname. Either way the suite
# writes to its own database on that server - `POSTGRES_DB` with `_test` appended, created and
# migrated by `tests/conftest.py` - and not to the one the `api` service serves from. See
# CONTRIBUTING.md.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # Dev dependencies come from `uv.lock` via the `dev` extra, installed at image
      # build time. The previous `pip install faker pytest-asyncio pytest-mock` at
      # container start pulled unpinned versions and needed `user: root` to write into
      # the image's site-packages - both gone now.
      target: test
    command: pytest tests/ -v
    # Cancels the base file's `restart: unless-stopped`. Compose merges service
    # definitions field by field across `-f` files, so a scalar the overlay doesn't
    # mention is inherited rather than reset - and inheriting it here turns a test run
    # into a loop: the daemon restarts the container the moment pytest exits, whatever
    # the exit code, so the suite races `--abort-on-container-exit`'s teardown and runs
    # forever without it. Same reason `admin_init` sets it in the base file.
    restart: "no"
    volumes:
      - ./tests:/code/tests
      - ./src:/code/src
